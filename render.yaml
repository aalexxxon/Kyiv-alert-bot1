services:
  - type: web
    name: kyiv-alert-bot
    runtime: python-3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
    autodeploy: true
